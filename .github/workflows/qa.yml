name: QA
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm test
